name: Build Windows EXE

# Compila o DigiTracker.exe num runner Windows da nuvem e publica como Release.
# - Push de uma tag "v*"  -> cria/atualiza um Release com o .exe anexado.
# - Execução manual        -> sobe o .exe como artifact da execução.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write          # necessário para criar Releases

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build com PyInstaller
        run: pyinstaller digitracker.spec --noconfirm

      - name: Upload artifact (sempre)
        uses: actions/upload-artifact@v4
        with:
          name: DigiTracker-windows
          path: dist/DigiTracker.exe
          if-no-files-found: error

      - name: Publicar Release (apenas em tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }} dist/DigiTracker.exe
          --title "DigiTracker ${{ github.ref_name }}"
          --notes "Executável Windows do DigiTracker (onefile). Baixe **DigiTracker.exe** abaixo e execute. Na primeira vez, informe seu username + Web API Key da RetroAchievements (ou use o modo demonstração)."
