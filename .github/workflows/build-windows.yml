name: Build Windows EXE

# Compila o DigiTracker.exe num runner Windows da nuvem e publica como Release.
# - Push de uma tag "v*"  -> cria/atualiza um Release com o .exe anexado.
# - Execução manual        -> sobe o .exe como artifact da execução.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write          # necessário para criar Releases

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt -r requirements-dev.txt

      - name: Validar versão da tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $appVersion = python -c "from version import APP_VERSION; print(APP_VERSION)"
          if ("v$appVersion" -ne "${{ github.ref_name }}") {
            throw "A tag ${{ github.ref_name }} não corresponde a APP_VERSION=$appVersion"
          }

      - name: Testes
        run: python -m pytest tests/ -q

      - name: Build com PyInstaller
        run: pyinstaller digitracker.spec --noconfirm

      - name: Gerar SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/DigiTracker.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DigiTracker.exe" | Out-File dist/DigiTracker.exe.sha256 -Encoding ascii

      - name: Upload artifact (sempre)
        uses: actions/upload-artifact@v7
        with:
          name: DigiTracker-windows
          path: |
            dist/DigiTracker.exe
            dist/DigiTracker.exe.sha256
          if-no-files-found: error

      - name: Publicar Release (apenas em tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }} dist/DigiTracker.exe dist/DigiTracker.exe.sha256
          --title "DigiTracker ${{ github.ref_name }}"
          --generate-notes
