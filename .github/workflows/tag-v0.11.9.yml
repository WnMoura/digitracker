name: Tag v0.11.9
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create v0.11.9 tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify refs/tags/v0.11.9 >/dev/null; then exit 0; fi
          git tag -a v0.11.9 112476a0fbbd0d6a92be48760e0c07ebf231b4b5 -m "DigiTracker v0.11.9"
          git push origin refs/tags/v0.11.9
