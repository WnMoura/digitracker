name: Publish DigiTracker v0.10.4

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v0.10.4.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate release version
        shell: pwsh
        run: |
          $appVersion = python -c "from version import APP_VERSION; print(APP_VERSION)"
          if ($appVersion -ne "0.10.4") {
            throw "APP_VERSION esperado: 0.10.4; encontrado: $appVersion"
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt -r requirements-dev.txt

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Build EXE
        run: pyinstaller digitracker.spec --noconfirm

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/DigiTracker.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DigiTracker.exe" | Out-File dist/DigiTracker.exe.sha256 -Encoding ascii

      - name: Create tag v0.10.4
        shell: pwsh
        run: |
          if (git ls-remote --exit-code --tags origin refs/tags/v0.10.4) {
            Write-Host "Tag v0.10.4 already exists"
          } else {
            git tag v0.10.4 $env:GITHUB_SHA
            git push origin v0.10.4
          }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if (gh release view v0.10.4 *> $null) {
            gh release upload v0.10.4 dist/DigiTracker.exe dist/DigiTracker.exe.sha256 --clobber
          } else {
            gh release create v0.10.4 dist/DigiTracker.exe dist/DigiTracker.exe.sha256 --title "DigiTracker v0.10.4" --notes-file docs/RELEASE_v0.10.4.md
          }
