name: Mobile E continuation
on:
  push:
    branches: [feat/mobile-step8-integration]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/mobile-step8-integration
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Apply reader and navigation patch
        run: |
          python tools/mobile_e_phase3_patch.py
          python tools/mobile_e_phase3_finalize.py
          python - <<'PY'
          from pathlib import Path
          p = Path('companion.py')
          text = p.read_text(encoding='utf-8')
          if 'import copy\n' not in text:
              text = text.replace('import base64\n', 'import base64\nimport copy\n', 1)
              p.write_text(text, encoding='utf-8', newline='\n')

          smoke = Path('tests/companion_ui_smoke.cjs')
          text = smoke.read_text(encoding='utf-8')
          needle = '''    await page.locator("[data-act='item-save']").click();
    await page.locator("#tabs [data-tab='more']").click();'''
          replacement = '''    await page.locator("[data-act='item-save']").click();
    await page.locator("[data-act='item-back']").click();
    await page.waitForSelector("[data-act='item-open']");
    await page.locator("#tabs [data-tab='more']").click();'''
          if needle not in text:
              raise SystemExit('item smoke transition anchor not found')
          smoke.write_text(text.replace(needle, replacement, 1), encoding='utf-8', newline='\n')
          PY
      - name: Syntax checks
        run: |
          python -m py_compile companion.py experience_api.py
          node --check ui/companion/app.js
          node --check tests/companion_ui_smoke.cjs
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Targeted tests
        run: python -m pytest tests/test_experience.py -q
      - name: Full suite
        run: python -m pytest tests/ -q
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.62.0
          npx playwright install --with-deps chromium webkit
      - name: Companion smoke Chromium and WebKit
        shell: bash
        run: |
          python -m http.server 8781 --directory ui/companion > /tmp/companion-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8781/index.html >/dev/null && break; sleep 0.25; done
          PW_ENGINE=chromium node tests/companion_ui_smoke.cjs http://127.0.0.1:8781
          PW_ENGINE=webkit node tests/companion_ui_smoke.cjs http://127.0.0.1:8781
      - name: Commit validated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add companion.py ui/companion/app.js ui/companion/style.css tests/test_experience.py tests/companion_ui_smoke.cjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: complete mobile reader navigation contracts"
          git push origin HEAD:feat/mobile-step8-integration
