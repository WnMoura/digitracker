name: Mobile E continuation

on:
  push:
    branches:
      - feat/mobile-step8-integration

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/mobile-step8-integration
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply continuation patch
        run: python tools/mobile_e_continuation_patch.py

      - name: Syntax checks
        run: |
          python -m py_compile companion.py smart_guide.py experience_api.py
          node --check ui/companion/app.js
          node --check ui/companion/state.js
          node --check ui/companion/storage.js
          node --check tests/companion_ui_smoke.cjs

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Targeted tests
        run: python -m pytest tests/test_smart_guide.py tests/test_experience.py tests/test_item_catalog.py -q

      - name: Full test suite
        run: python -m pytest tests/ -q

      - name: Commit validated continuation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add companion.py smart_guide.py ui/companion/app.js ui/companion/state.js tests/test_smart_guide.py tests/test_experience.py tests/companion_ui_smoke.cjs
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "fix: complete mobile command concurrency contracts"
          git push origin HEAD:feat/mobile-step8-integration
