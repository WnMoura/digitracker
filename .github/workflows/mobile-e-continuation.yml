name: Mobile E continuation
on:
  push:
    branches: [feat/mobile-step8-integration]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/mobile-step8-integration
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Apply connection and polling patch
        run: python tools/mobile_e_phase2_patch.py
      - name: Syntax checks
        run: |
          python -m py_compile companion.py experience_api.py
          node --check ui/companion/app.js
          node --check ui/experience.js
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Targeted tests
        run: python -m pytest tests/test_experience.py -q
      - name: Full suite
        run: python -m pytest tests/ -q
      - name: Commit validated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add companion.py experience_api.py ui/companion/app.js ui/experience.js tests/test_experience.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add selective mobile polling and device recovery"
          git push origin HEAD:feat/mobile-step8-integration
