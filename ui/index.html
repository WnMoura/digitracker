<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigiTracker</title>
  <!-- Fontes servidas do disco: o app é offline-first e não deve depender do
       CDN do Google para renderizar corretamente. -->
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Barra de título (frameless / arrastável) -->
    <div class="titlebar pywebview-drag-region">
      <span class="dot"></span>
      <span class="brand">DIGI<span>TRACKER</span></span>
      <span class="spacer"></span>
      <span class="sync-tag" id="sync-tag"></span>
      <div class="win-btns">
        <button class="win-btn compact-btn" id="btn-compact" title="Modo compacto (overlay de progresso)">▣</button>
        <button class="win-btn pin" id="btn-pin" title="Sempre por cima">📌</button>
        <button class="win-btn" id="btn-min" title="Minimizar">—</button>
        <button class="win-btn close" id="btn-close" title="Fechar">✕</button>
      </div>
    </div>

    <div id="demo-banner" class="demo-banner hidden">
      <span class="demo-banner-txt">MODO DEMONSTRAÇÃO — dados fictícios. Configure suas credenciais para usar dados reais.</span>
      <button id="btn-exit-demo" class="exit-demo-btn" title="Sair da demonstração">Sair da demonstração</button>
    </div>

    <!-- Conteúdo trocado por JS -->
    <div class="body" id="root"></div>
  </div>

  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
