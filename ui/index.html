<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigiTracker</title>
  <!-- Fontes servidas do disco: o app é offline-first e não deve depender do
       CDN do Google para renderizar corretamente. -->
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="style.css?v=8" />
</head>
<body>
  <div id="app">
    <!-- Barra de título (frameless / arrastável) -->
    <div class="titlebar pywebview-drag-region">
      <span class="dot"></span>
      <button class="win-btn library-btn" id="btn-library" title="Abrir biblioteca" aria-label="Abrir biblioteca" aria-expanded="false" hidden>☰</button>
      <span class="brand">DIGI<span>TRACKER</span></span>
      <span class="spacer"></span>
      <span class="sync-tag" id="sync-tag"></span>
      <div class="win-btns">
        <button class="win-btn compact-btn" id="btn-compact" title="Modo compacto (overlay de progresso)" aria-label="Modo compacto">▣</button>
        <button class="win-btn pin" id="btn-pin" title="Sempre por cima" aria-label="Sempre por cima">📌</button>
        <button class="win-btn" id="btn-settings" title="Configurações" aria-label="Configurações">⚙</button>
        <button class="win-btn" id="btn-min" title="Minimizar" aria-label="Minimizar">—</button>
        <button class="win-btn close" id="btn-close" title="Fechar" aria-label="Fechar">✕</button>
      </div>
    </div>

    <div id="demo-banner" class="demo-banner hidden">
      <span class="demo-banner-txt">Modo demonstração, com dados fictícios. Configure suas credenciais para ver os dados reais.</span>
      <button id="btn-exit-demo" class="exit-demo-btn" title="Sair da demonstração">Sair da demonstração</button>
    </div>

    <!-- Conteúdo trocado por JS -->
    <div class="body" id="root"></div>

    <!-- Atalhos do rodapé, no espírito do Big Picture. As teclas funcionam. -->
    <div class="keybar" id="keybar">
      <span class="spacer"></span>
      <span class="keyhint"><span class="key">D-pad</span><span class="key">Setas</span>navegar</span>
      <span class="keyhint"><span class="key">A</span><span class="key">Enter</span>selecionar</span>
      <span class="keyhint"><span class="key">LB</span><span class="key">RB</span>aba</span>
      <span class="keyhint"><span class="key">C</span>compacto</span>
      <span class="keyhint"><span class="key">Esc</span>voltar</span>
    </div>
  </div>

  <div id="toast"></div>
  <script src="app.js?v=8"></script>
</body>
</html>
